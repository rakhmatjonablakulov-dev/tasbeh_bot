<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
body {
  background: linear-gradient(rgba(11, 38, 47, 0.45), rgba(5, 20, 25, 0.8)), 
  url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
  background-size: cover;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  overflow-x: hidden;
  position: relative;
}
.sky-elements {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 60%;
  pointer-events: none; z-index: 1;
}
.moon {
  position: absolute;
  top: 175px; left: 50%;
  transform: translateX(-50%);
  width: 32px; height: 32px;
  background: transparent;
  border-radius: 50%;
  box-shadow: 7px 2px 0 0 rgba(255, 221, 64, 0.95);
  filter: drop-shadow(0 0 10px rgba(255, 221, 64, 0.8));
  z-index: 3;
}
.stars {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    radial-gradient(white 1.5px, transparent 0),
    radial-gradient(rgba(241, 196, 15, 0.8) 2px, transparent 0);
  background-size: 60px 60px, 90px 90px;
  opacity: 0.8;
}
.header {
  text-align: center;
  width: 100%;
  z-index: 2;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 6px;
  margin-bottom: 8px;
  padding: 0 2px;
}
.top-btns {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
  max-width: 260px;
}
.action-btn {
  background: rgba(15, 40, 30, 0.88);
  border: 1px solid #f1c40f;
  color: #f1c40f;
  padding: 5px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  backdrop-filter: blur(5px);
  white-space: nowrap;
  transition: all 0.2s ease;
}
.action-btn.voice-active {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border-color: #ffe875;
  color: #ffffff;
  box-shadow: 0 0 12px rgba(231, 76, 60, 0.8);
}
.rating-menu-btn {
  background: linear-gradient(135deg, rgba(241, 196, 15, 0.25), rgba(15, 45, 35, 0.92));

  box-shadow: 0 0 8px rgba(241, 196, 15, 0.25);
}

  font-size: 14px;
  font-weight: 700;
  color: #f1c40f;

  line-height: 1.25;
  padding-top: 2px;
}

  display: flex;
  gap: 6px;
  overflow-x: auto;
  width: 100%;
  padding: 2px 0;
  scrollbar-width: none;
  z-index: 2;
  margin-top: 5px;
}
.zikr-selector::-webkit-scrollbar { display: none; }
.zikr-tab {
  background: rgba(10, 30, 25, 0.8);
  border: 1px solid rgba(241, 196, 15, 0.5);
  color: #e2e8f0;
  padding: 5px 11px;
  border-radius: 12px;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: all 0.25s ease;
}
.zikr-tab.active {
  background: linear-gradient(135deg, #f1c40f, #d4ac0d);
  color: #0b3c2e;
  font-weight: bold;
  border-color: #f1c40f;
  box-shadow: 0 0 12px rgba(241, 196, 15, 0.7);
}
.widget-panel {
  background: rgba(8, 28, 22, 0.8);

  border-radius: 12px;

  margin-top: 8px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(6px);
  z-index: 2;
  width: 100%;
}
.live-clock {

  font-weight: bold;
  color: #f1c40f;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.next-prayer-info {
  font-size: 11px;
  color: #a3e4d7;
  text-align: right;
  line-height: 1.3;

  color: #f1c40f;

  border-radius: 20px;
  display: inline-block;
  backdrop-filter: blur(4px);
  font-weight: 500;
}
.milestone-toast {
  font-size: 12px;
  color: #0b3c2e;
  background: #f1c40f;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: bold;
  display: inline-block;
  margin-bottom: 4px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.milestone-toast.show { opacity: 1; }
.counter-value {
  font-size: 64px;
  font-weight: 700;
  color: #f1c40f;
  text-shadow: 0 0 20px rgba(241, 196, 15, 0.9), 0 2px 5px rgba(0,0,0,0.8);
  line-height: 1;
}
.counter-arabic {
  font-size: 20px;
  color: #ffffff;
  margin-top: 6px;
  font-weight: bold;
  text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  padding: 0 10px;
  direction: rtl;
}
.counter-label {
  font-size: 12px;
  color: #a3e4d7;
  margin-top: 4px;
  font-weight: 500;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
.voice-status-bar {
  font-size: 11px;
  color: #ffe875;

  z-index: 2;

  width: 150px;

}
